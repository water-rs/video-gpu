[package]
name = "waterui-video-gpu"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/video-gpu"
description = "Self-drawn GPU realization for WaterUI Video and VideoPlayer"
keywords = ["video", "player", "gpu", "wgpu", "waterui"]
categories = ["gui", "multimedia::video", "rendering"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
async-channel = "2.5"
futures-timer = "3"
# Requirement strings stay satisfied by the pinned sources: the requirements
# match the manifest versions the pinned revs declare; a git patch cannot
# satisfy a requirement its manifest does not carry.
waterui-video = { version = "0.5.1" }
waterui-core = { version = "0.5.1" }
waterui-layout = { version = "0.5.1" }
waterui-controls = { version = "0.5.1" }
waterui-graphics = { version = "0.5.1" }
shaderloom = "0.1.2"
waterui-text = { version = "0.5.1" }
waterkit-video = { version = "0.1.4", features = ["streaming"] }
waterkit-codec = { version = "0.1.4", features = ["software-decode"] }
waterkit-audio = { version = "0.1.4", features = ["streaming"] }
waterkit-fs = { version = "0.1.4" }
futures = "0.3"
executor-core = "0.7.1"
nami = "=0.11.1"
num-traits = { version = "0.2", default-features = false }
tracing = "0.1.44"
uuid = "1.26.0"
wgpu = "30.0.1"

[build-dependencies]
shaderloom = { version = "0.1.2", features = ["build"] }
waterkit-codec = { version = "0.1.4" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
waterkit-audio = { version = "0.1.4", features = ["he-aac"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.26.0", features = ["js"] }

[dev-dependencies]
half = "2.4"
hydrolysis-m3 = "0.3.0"
pollster = "1.0"
waterui = { version = "0.5.2", features = ["video-gpu"] }
waterui-testing = "0.5.1"

[package.metadata.cargo-machete]
ignored = ["shaderloom"]

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `refs/staging/efv-r9`
# (d3aa13bff6590cec752b0bb590022924953491a3), the external-frame cutover base.
[patch.crates-io]
waterui-video-gpu = { path = "." }
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
# `block` 0.1.6 declares the Blocks ABI symbol as an uninhabited extern
# static; this fork takes its address as the opaque class pointer instead.
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
# vello loses the Vulkan device on Mali (linebender/vello#1817); only
# `waterui-map-gpu` still links it — the pin rides along so that leg resolves
# the same fixed source the framework pins.
vello = { git = "https://github.com/lexoliu/vello", rev = "76292095f408cf04b901023c2053f8d424652f06" }

# nami#26 renames `Signal::get` to `Signal::snapshot`; both nami crates ride
# the framework's pinned rev so the graph carries one `Signal` trait.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# The Cherenkov engine stack at the revision WaterUI's own Cargo.lock pins at
# the ab667e569 base: the e2e dev-dependency hydrolysis-m3 names `cherenkov`
# as a *git* dependency at this rev, and a git dependency cannot be
# retargeted to another revision of the same repository, so 8d00976e is the
# only revision the graph resolves to a single copy. It carries cherenkov
# #89 (external frames) and #165 (the Apple Metal import); it predates #166
# (`ExternalFrame::native` — the engine-side AHardwareBuffer/dmabuf import
# for the Android leg, merged as #217 at e36e0dd). The Android engine-native
# import leg lands with the coordinated upstream cherenkov bump — see the
# delivery report.
cherenkov = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
cherenkov-cpu = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
cherenkov-gpu = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
cherenkov-shader = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
filtrate = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
filtrate-core = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
filtrate-derive = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }

# Migrated framework crates pinned to waterui's refs/staging/efv-r9 head —
# the external-frame cutover base carrying `ExternalFrameView`.
waterui = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
