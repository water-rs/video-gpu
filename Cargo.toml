[package]
name = "waterui-video-gpu"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/video-gpu"
description = "Self-drawn GPU realization for WaterUI Video and VideoPlayer"
keywords = ["video", "player", "gpu", "wgpu", "waterui"]
categories = ["gui", "multimedia::video", "rendering"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
async-channel = "2.5"
futures-timer = "3"
# Requirement strings stay satisfied by the pinned sources: the requirements
# match the manifest versions the pinned revs declare; a git patch cannot
# satisfy a requirement its manifest does not carry.
waterui-video = { version = "0.5.1" }
waterui-core = { version = "0.5.1" }
waterui-layout = { version = "0.5.1" }
waterui-controls = { version = "0.5.1" }
waterui-graphics = { version = "0.5.1", features = ["gpu"] }
shaderloom = { version = "0.1.2", default-features = false, features = ["runtime"] }
waterui-text = { version = "0.5.1" }
waterkit-video = { version = "0.1.4", features = ["streaming"] }
waterkit-codec = { version = "0.1.4", default-features = false, features = ["gpu", "software-decode"] }
waterkit-audio = { version = "0.1.4", features = ["streaming"] }
waterkit-fs = { version = "0.1.4" }
futures = "0.3"
executor-core = "0.7.1"
nami = "0.12"
num-traits = { version = "0.2", default-features = false }
tracing = "0.1.44"
uuid = "1.26.0"

[build-dependencies]
shaderloom = { version = "0.1.2", default-features = false, features = ["build"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
waterkit-audio = { version = "0.1.4", features = ["he-aac"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.26.0", features = ["js"] }

[dev-dependencies]
half = "2.4"
hydrolysis-m3 = "0.3.1"
pollster = "1.0"
waterui = { version = "0.5.2", features = ["video-gpu"] }
waterui-testing = "0.5.1"

[package.metadata.cargo-machete]
ignored = ["shaderloom"]

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui at 0b982961 — the
# render-target-neutral recording contract of water-rs/waterui#1435. Every
# `waterui-*` crate this crate reaches, directly or transitively, is the same
# monorepo commit, and the Cherenkov engine family, the filtrate crates and
# hydrolysis live in that repository — under `graphics/` and
# `backends/hydrolysis` — so their requirements resolve there too
# (water-rs/waterui#1449).
[patch.crates-io]
waterui-video-gpu = { path = "." }

# nami#26 renames `Signal::get` to `Signal::snapshot`; both nami crates ride
# the framework's pinned rev so the graph carries one `Signal` trait.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# The Cherenkov engine family lives in water-rs/waterui under `graphics/`:
# the engine and its GPU backend, the `cherenkov-record` vocabulary
# `waterui_graphics::draw` re-exports, the shader composer and the filtrate
# filter crates all resolve to the same monorepo commit.
cherenkov = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
cherenkov-record = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
cherenkov-shader = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
filtrate = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
filtrate-core = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }

# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). Mirrored from water-rs/waterui's own
# `[patch.crates-io]` at the pinned revision: `[patch]` in a
# dependency's manifest does not apply downstream, so without these entries
# this graph resolves the crashing crates.io build while cherenkov resolves
# the fork. Drop them once wgpu-hal 30.0.2 ships the backport.
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }

# Migrated framework crates pinned to the waterui dev head carrying the
# recording contract; one revision serves every monorepo crate so the graph
# holds one copy of each.
waterui = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }

# WaterKit pinned to the external-frame codec revision (waterkit
# build/efv-frames): its `DecodedFrameUploader` produces the integer NV12/P010
# planes `ExternalFrame::yuv` imports and imports CVPixelBuffers through
# Metal on Apple, in place.
waterkit-audio = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-video = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-video-container = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-video-player = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-video-streaming = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }

# codec@925f2e1b asks for shaderloom's `runtime` feature, added after the
# 0.1.2 registry release; this rev also keeps `build` out of any normal
# dependency edge.
shaderloom = { git = "https://github.com/water-rs/shaderloom", rev = "b0b6870c8b560d902c1de9a4d039c3a921b18b92" }

# Split components pinned at their current dev heads — each already records
# through `waterui_graphics::draw` against this contract.
waterui-image = { git = "https://github.com/water-rs/image", rev = "8b1aa2ce3f03d81ca02164f5563f2cefc34fb566" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "23ab68ea81870b4a26635c0b699656b52cf9a3f3" }

# `hydrolysis` lives in the monorepo at `backends/hydrolysis`; `hydrolysis-m3`
# implements the backend contract the in-tree backend expects and is pinned at
# its dev head.
hydrolysis = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "f879ae9daf7c56ea7a012e0ae2cc640c1cf78588" }
