waterkit-audio = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-camera = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-haptic = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-screen = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-video = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
waterkit-video-container = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }
