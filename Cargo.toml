waterkit-video-streaming = { git = "https://github.com/water-rs/waterkit", rev = "0a6f2019b01d97a37fa31bfbe7e44c0f732d13f2" }

# shaderloom's packaged-artifact API (`shaderloom::packaged` / `runtime`) and
# wgpu-30 support land in water-rs/shaderloom#21; this is that PR's merge
# head (identical tree to the PR head 75a4f0d).
shaderloom = { git = "https://github.com/water-rs/shaderloom", rev = "84c37c8314f1bb6d228fce30f78d94872247a18f" }

# Same-wave satellites at the revs the framework's own patch table carries.
# (waterui-testing at ab667e569 calls `accessibility_activation_point`, which
# no cutover-era hydrolysis revision carries — the symbol exists only on
# hydrolysis's pre-cutover dev lineage — so `--all-targets` fails inside
# waterui-testing until upstream pairs the waves. See the delivery report.)
hydrolysis = { git = "https://github.com/water-rs/hydrolysis", rev = "6308831a4c082080460438002a5afde63b90b7de" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "6042ccae12251d6506b3a55a3ce0d70d13fdd5c4" }
waterui-image = { git = "https://github.com/water-rs/image", rev = "27ab17cad98e8b08f50d9df5a66d9ec11529a69f" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "d53a94b03236718c9ee506bd9f5b4b1d2f247a8b" }
waterui-canvas = { git = "https://github.com/water-rs/canvas", rev = "ac4737d276bcf4e7c498938c0842ab1f5848cf9a" }
waterui-barcode = { git = "https://github.com/water-rs/barcode", rev = "4c530503f6e3277f44511f327db463a195482abd" }
waterui-chart = { git = "https://github.com/water-rs/chart", rev = "ff481c3d319b7d025a1fa0c1dcdb283f92be9689" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", rev = "13e199d255a11637e03341e0a947447851eff85e" }
waterui-math = { git = "https://github.com/water-rs/math", rev = "f59cc09fd27f2000d36225e72662a653b5751182" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "e27ae84666ee58c2ff4adae16d9227baf7efc3f2" }
waterui-dew = { git = "https://github.com/water-rs/dew", rev = "1b683d0daab9a119396fb3b31d31bc2445f39bc9" }
waterui-gtk = { git = "https://github.com/water-rs/gtk-backend", rev = "bfa53ccd47ee733e878f27d878853b4a231d8bff" }
waterui-winui = { git = "https://github.com/water-rs/waterui-winui", rev = "fc4a6d59a0d520200f275f7cd29bfd749e928659" }
# Zero-copy external-frame import for the browser hosts (browser-cef/wpe) —
# pinned at the maintainer's rev so any host leg in the graph shares the
# wgpu-30 implementation.
wgpu-external-frame = { git = "https://github.com/water-rs/wgpu-external-frame", rev = "d047b57e6fd8930f95c78b3e4fba7b06cd056b68" }
