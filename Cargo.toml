[package]
name = "waterui-video-gpu"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/video-gpu"
description = "Self-drawn GPU realization for WaterUI Video and VideoPlayer"
keywords = ["video", "player", "gpu", "wgpu", "waterui"]
categories = ["gui", "multimedia::video", "rendering"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
async-channel = "2.5"
futures-timer = "3"
waterui-video = { version = "0.3.0" }
waterui-core = { version = "0.3.0" }
waterui-layout = { version = "0.3.0" }
waterui-controls = { version = "0.3.0" }
waterui-graphics = { version = "0.4.0", features = ["gpu"] }
shaderloom = "0.1.0"
waterui-text = { version = "0.4.0" }
waterkit-video = { version = "0.1.0", git = "https://github.com/water-rs/waterkit.git", branch = "dev", features = ["streaming"] }
waterkit-codec = { version = "0.1.0", git = "https://github.com/water-rs/waterkit.git", branch = "dev", features = ["software-fallback"] }
waterkit-audio = { version = "0.1.0", git = "https://github.com/water-rs/waterkit.git", branch = "dev", features = ["streaming"] }
waterkit-fs = { version = "0.1.0", git = "https://github.com/water-rs/waterkit.git", branch = "dev" }
futures = "0.3"
executor-core = "0.7.1"
nami = "0.11.0"
num-traits = { version = "0.2", default-features = false }
tracing = "0.1.44"
uuid = "1.26.0"
wgpu = "29.0.4"

[build-dependencies]
shaderloom = { version = "0.1.0", features = ["build"] }
waterkit-codec = { version = "0.1.0", git = "https://github.com/water-rs/waterkit.git", branch = "dev" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
waterkit-audio = { version = "0.1.0", git = "https://github.com/water-rs/waterkit.git", branch = "dev", features = ["he-aac"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.26.0", features = ["js"] }

[dev-dependencies]
hydrolysis-m3 = { git = "https://github.com/water-rs/waterui.git", branch = "dev" }
pollster = "1.0"
waterui = { git = "https://github.com/water-rs/waterui.git", branch = "dev", features = ["video-gpu"] }
waterui-testing = "0.4.0"

[package.metadata.cargo-machete]
ignored = ["shaderloom"]
