waterui-map = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "d3aa13bff6590cec752b0bb590022924953491a3" }

# WaterKit pinned to the external-frame codec revision (waterkit
# build/efv-frames): its `DecodedFrameUploader` produces the integer NV12/P010
