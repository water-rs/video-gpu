[package]
name = "waterui-video-gpu"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/video-gpu"
description = "Self-drawn GPU realization for WaterUI Video and VideoPlayer"
keywords = ["video", "player", "gpu", "wgpu", "waterui"]
categories = ["gui", "multimedia::video", "rendering"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
async-channel = "2.5"
futures-timer = "3"
# Requirement strings stay satisfied by the pinned sources: the requirements
# match the manifest versions the patched sources declare; a git patch cannot
# satisfy a requirement its manifest does not carry.
waterui-video = { version = "0.5.1" }
waterui-core = { version = "0.5.1" }
waterui-layout = { version = "0.5.1" }
waterui-controls = { version = "0.5.1" }
waterui-graphics = { version = "0.5.1", features = ["gpu"] }
shaderloom = { version = "0.2.1", default-features = false, features = ["runtime"] }
waterui-text = { version = "0.5.1" }
waterkit-video = { version = "0.1.4", features = ["streaming"] }
waterkit-codec = { version = "0.1.4", default-features = false, features = ["gpu", "software-decode"] }
waterkit-audio = { version = "0.1.4", features = ["streaming"] }
waterkit-fs = { version = "0.1.4" }
futures = "0.3"
executor-core = "0.7.1"
nami = "0.13"
num-traits = { version = "0.2", default-features = false }
tracing = "0.1.44"
uuid = "1.26.0"

[build-dependencies]
shaderloom = { version = "0.2.1", default-features = false, features = ["build"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(target_vendor = "apple")'.dependencies]
waterkit-core = { version = "0.1.4" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
waterkit-audio = { version = "0.1.4", features = ["he-aac"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.26.0", features = ["js"] }

[dev-dependencies]
half = "2.4"
hydrolysis-m3 = "0.3.1"
pollster = "1.0"
waterui = { version = "0.5.2", features = ["video-gpu"] }
waterui-testing = "0.5.1"

[package.metadata.cargo-machete]
ignored = ["shaderloom"]

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui on `feat/2633-nami-0.13`,
# which moves the framework to nami 0.13 / nami-core 0.5; `Cargo.lock`
# records the exact commit. Every `waterui-*` crate this crate reaches,
# directly or transitively, is the same monorepo commit, and the Cherenkov
# engine family, the filtrate crates and hydrolysis live in that repository —
# under `graphics/` and `backends/hydrolysis` — so their requirements resolve
# there too (water-rs/waterui#1449).
[patch.crates-io]
waterui-video-gpu = { path = "." }

# suiteki 0.1.1 on crates.io implements nami-core 0.3's `Signal`; suiteki's
# `dev` implements 0.5's (water-rs/suiteki#29), the source the framework's own
# patch table names. Drop once a release carries it.
suiteki = { git = "https://github.com/water-rs/suiteki", branch = "dev" }

# The Cherenkov engine family lives in water-rs/waterui under `graphics/`:
# the engine and its GPU backend, the `cherenkov-record` vocabulary
# `waterui_graphics::draw` re-exports, the shader composer and the filtrate
# filter crates all resolve to the same monorepo commit.
cherenkov = { git = "https://github.com/water-rs/waterui", branch = "dev" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", branch = "dev" }
cherenkov-record = { git = "https://github.com/water-rs/waterui", branch = "dev" }
cherenkov-shader = { git = "https://github.com/water-rs/waterui", branch = "dev" }
filtrate = { git = "https://github.com/water-rs/waterui", branch = "dev" }
filtrate-core = { git = "https://github.com/water-rs/waterui", branch = "dev" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", branch = "dev" }

# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). Mirrored from water-rs/waterui's own
# `[patch.crates-io]` on the branch named above: `[patch]` in a
# dependency's manifest does not apply downstream, so without these entries
# this graph resolves the crashing crates.io build while cherenkov resolves
# the fork. Drop them once wgpu-hal 30.0.2 ships the backport.
naga = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }

# Migrated framework crates on the waterui branch named above; one source
# serves every monorepo crate so the graph holds one copy of each.
waterui = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-assets = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-controls = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-core = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-form = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-icon = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-internal = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-layout = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-locale = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-macros = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-map = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-media = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-shape = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-testing = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-text = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-url = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-video = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-webview = { git = "https://github.com/water-rs/waterui", branch = "dev" }

# WaterKit follows waterkit's `dev`, the source the framework's own patch
# table names, with the exact commit recorded in `Cargo.lock`. It carries the
# shaderloom 0.2.1 move (water-rs/waterkit#246) and the external-frame codec:
# its `DecodedFrameUploader` produces the integer NV12/P010 planes
# `ExternalFrame::yuv` imports and imports CVPixelBuffers through Metal on
# Apple, in place.
waterkit-audio = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-build = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-container = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-player = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-streaming = { git = "https://github.com/water-rs/waterkit", branch = "dev" }

# Split components at the revisions the framework's own patch table pins —
# each records through `waterui_graphics::draw` against this contract.
waterui-image = { git = "https://github.com/water-rs/image", rev = "a36e16c555bd78ade9e28fad947af66a52f8f071" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16f99e021f735d0b1b31c95552b074e953d56418" }

# `hydrolysis` lives in the monorepo at `backends/hydrolysis`; `hydrolysis-m3`
# implements the backend contract the in-tree backend expects and follows its
# `dev`, the source the framework's own patch table names.
hydrolysis = { git = "https://github.com/water-rs/waterui", branch = "dev" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", branch = "dev" }
