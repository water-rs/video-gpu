[package]
name = "waterui-video-gpu"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/video-gpu"
description = "Self-drawn GPU realization for WaterUI Video and VideoPlayer"
keywords = ["video", "player", "gpu", "wgpu", "waterui"]
categories = ["gui", "multimedia::video", "rendering"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
async-channel = "2.5"
futures-timer = "3"
# Requirement strings stay satisfied by the pinned sources: the requirements
# match the manifest versions the pinned revs declare; a git patch cannot
# satisfy a requirement its manifest does not carry.
waterui-video = { version = "0.5.1" }
waterui-core = { version = "0.5.1" }
waterui-layout = { version = "0.5.1" }
waterui-controls = { version = "0.5.1" }
waterui-graphics = { version = "0.5.1", features = ["gpu"] }
shaderloom = { version = "0.2.1", default-features = false, features = ["runtime"] }
waterui-text = { version = "0.5.1" }
waterkit-video = { version = "0.1.4", features = ["streaming"] }
waterkit-codec = { version = "0.1.4", default-features = false, features = ["gpu", "software-decode"] }
waterkit-audio = { version = "0.1.4", features = ["streaming"] }
waterkit-fs = { version = "0.1.4" }
futures = "0.3"
executor-core = "0.7.1"
nami = "0.12"
num-traits = { version = "0.2", default-features = false }
tracing = "0.1.44"
uuid = "1.26.0"

[build-dependencies]
shaderloom = { version = "0.2.1", default-features = false, features = ["build"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(target_vendor = "apple")'.dependencies]
waterkit-core = { version = "0.1.4" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
waterkit-audio = { version = "0.1.4", features = ["he-aac"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.26.0", features = ["js"] }

[dev-dependencies]
half = "2.4"
hydrolysis-m3 = "0.3.1"
pollster = "1.0"
waterui = { version = "0.5.2", features = ["video-gpu"] }
waterui-testing = "0.5.1"

[package.metadata.cargo-machete]
ignored = ["shaderloom"]

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `dev`
# (59874864a13f28509bb09c8db3b162649322de94), which carries the shaderloom
# 0.2.1 move — waterui-graphics asks for `runtime`, a feature no shaderloom
# 0.1 registry release has. Every `waterui-*` crate this crate reaches,
# directly or transitively, is the same monorepo commit, and the Cherenkov
# engine family, the filtrate crates and hydrolysis live in that repository —
# under `graphics/` and `backends/hydrolysis` — so their requirements resolve
# there too (water-rs/waterui#1449).
[patch.crates-io]
waterui-video-gpu = { path = "." }

# suiteki 0.1.1 on crates.io implements nami-core 0.3's `Signal`; suiteki dev
# at the merge of water-rs/suiteki#27 implements 0.4's, the rev the
# framework's own patch table pins. Drop once a release carries it.
suiteki = { git = "https://github.com/water-rs/suiteki", rev = "7cf17bdba0e978d388a096b1916daebdc17253b4" }

# The Cherenkov engine family lives in water-rs/waterui under `graphics/`:
# the engine and its GPU backend, the `cherenkov-record` vocabulary
# `waterui_graphics::draw` re-exports, the shader composer and the filtrate
# filter crates all resolve to the same monorepo commit.
cherenkov = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
cherenkov-record = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
cherenkov-shader = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
filtrate = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
filtrate-core = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }

# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). Mirrored from water-rs/waterui's own
# `[patch.crates-io]` at the pinned revision: `[patch]` in a
# dependency's manifest does not apply downstream, so without these entries
# this graph resolves the crashing crates.io build while cherenkov resolves
# the fork. Drop them once wgpu-hal 30.0.2 ships the backport.
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }

# Migrated framework crates pinned to the waterui revision named above; one
# revision serves every monorepo crate so the graph holds one copy of each.
waterui = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }

# WaterKit pinned to waterkit `dev` HEAD, which carries the shaderloom 0.2.1
# move (water-rs/waterkit#246) — codec asks for `runtime`, a feature no
# shaderloom 0.1 registry release has — and the external-frame codec: its
# `DecodedFrameUploader` produces the integer NV12/P010 planes
# `ExternalFrame::yuv` imports and imports CVPixelBuffers through Metal on
# Apple, in place.
waterkit-audio = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-video = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-video-container = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-video-player = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }
waterkit-video-streaming = { git = "https://github.com/water-rs/waterkit", rev = "c3ea2a5ad27c6e4eae2168d7e595389b570b6b33" }

# Split components at the revisions the framework's own patch table pins —
# each records through `waterui_graphics::draw` against this contract.
waterui-image = { git = "https://github.com/water-rs/image", rev = "41bd909642a78c22aed55ba7c4ae362a439db4c6" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16f99e021f735d0b1b31c95552b074e953d56418" }

# `hydrolysis` lives in the monorepo at `backends/hydrolysis`; `hydrolysis-m3`
# implements the backend contract the in-tree backend expects and is pinned at
# the rev the framework's own patch table pins.
hydrolysis = { git = "https://github.com/water-rs/waterui", rev = "59874864a13f28509bb09c8db3b162649322de94" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "bc412a1a7e796cedc30d2c62d33fe293634574a8" }
