[package]
name = "waterui-video-gpu"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/video-gpu"
description = "Self-drawn GPU realization for WaterUI Video and VideoPlayer"
keywords = ["video", "player", "gpu", "wgpu", "waterui"]
categories = ["gui", "multimedia::video", "rendering"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
async-channel = "2.5"
futures-timer = "3"
waterui-video = { version = "0.3.2" }
waterui-core = { version = "0.3.2" }
waterui-layout = { version = "0.3.2" }
waterui-controls = { version = "0.3.2" }
waterui-graphics = { version = "0.4.1", features = ["gpu"] }
shaderloom = "0.1.2"
waterui-text = { version = "0.4.1" }
waterkit-video = { version = "0.1.2", features = ["streaming"] }
waterkit-codec = { version = "0.1.2", features = ["software-fallback"] }
waterkit-audio = { version = "0.1.2", features = ["streaming"] }
waterkit-fs = { version = "0.1.2" }
futures = "0.3"
executor-core = "0.7.1"
nami = "0.11.2"
num-traits = { version = "0.2", default-features = false }
tracing = "0.1.44"
uuid = "1.26.0"
wgpu = "29.0.4"

[build-dependencies]
shaderloom = { version = "0.1.2", features = ["build"] }
waterkit-codec = { version = "0.1.2" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
waterkit-audio = { version = "0.1.2", features = ["he-aac"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.26.0", features = ["js"] }

[dev-dependencies]
hydrolysis-m3 = "0.2.0"
pollster = "1.0"
waterui = { version = "0.4.1", features = ["video-gpu"] }
waterui-testing = "0.4.1"

[package.metadata.cargo-machete]
ignored = ["shaderloom"]

# The WaterUI packages above come from crates.io, so this repository builds
# against the same released APIs its users get. The third-party pins below are
# the framework's own: the published `waterui-graphics` was built with these
# forks, and dropping them here would render this crate's tests through
# different code than the framework runs.
[patch.crates-io]
# The published `waterui`'s `video-gpu` feature requires `waterui-video-gpu`;
# resolving it to this crate keeps one video realization in the test graph.
waterui-video-gpu = { path = "." }
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
vello = { git = "https://github.com/lexoliu/vello", rev = "5e5f538556be16527f67379b105af82f408b747d" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
