waterui-url = { git = "https://github.com/water-rs/waterui", rev = "7db24d50271b27d9962ac1fc94789616c3147986" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "7db24d50271b27d9962ac1fc94789616c3147986" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "7db24d50271b27d9962ac1fc94789616c3147986" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "7db24d50271b27d9962ac1fc94789616c3147986" }

