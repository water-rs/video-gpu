waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "7db24d50271b27d9962ac1fc94789616c3147986" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "7db24d50271b27d9962ac1fc94789616c3147986" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "7db24d50271b27d9962ac1fc94789616c3147986" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "7db24d50271b27d9962ac1fc94789616c3147986" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "7db24d50271b27d9962ac1fc94789616c3147986" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "7db24d50271b27d9962ac1fc94789616c3147986" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "7db24d50271b27d9962ac1fc94789616c3147986" }
